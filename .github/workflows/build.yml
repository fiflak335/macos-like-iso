name: Build macOS-like ISO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO in Debian container
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            debian:bookworm \
            bash -c "apt-get update && apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common syslinux-efi grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates curl git && chmod +x auto/config auto/build config/hooks/*.hook.chroot && ./auto/config && ./auto/build"
        timeout-minutes: 120

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: macos-like-iso
          path: "${{ github.workspace }}/*.iso"
          retention-days: 7