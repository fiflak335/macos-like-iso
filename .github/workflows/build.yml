name: Build macOS-like ISO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso \
            isolinux syslinux-efi grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Build ISO
        run: |
          cd $GITHUB_WORKSPACE
          chmod +x auto/build config/hooks/*.sh || true
          sudo ./auto/build
        timeout-minutes: 120

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: macos-like-iso
          path: "${{ github.workspace }}/*.iso"
          retention-days: 7